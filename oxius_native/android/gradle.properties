# 4G/1G, not 8G/4G. This machine has 16GB total and runs an IDE alongside
# the build; asking for 12GB made the daemon die mid-bundle with
# "Gradle build daemon disappeared unexpectedly", which reads like a
# code failure but is the OS reclaiming it.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# One worker, no parallel projects. R8 + resource shrinking is the
# heaviest step in a release bundle; running several of those at once
# is what pushed the daemon over this machine's memory and made it
# vanish without an error.
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.caching=true

android.useAndroidX=true
android.enableJetifier=true

dev.steenbakker.mobile_scanner.useUnbundled=true

# Enable Gradle toolchain auto-provisioning for Java 17
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Flutter 3.44 tooling gives Kotlin JVM target 21 while older plugins
# (flutter_facebook_auth etc.) still compile Java at 1.8. Mixed targets are
# fine for Android (D8 desugars both) — downgrade the hard error to a warning.
kotlin.jvm.target.validation.mode=warning
